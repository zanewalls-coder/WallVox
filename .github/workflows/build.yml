name: Build WallVox + Wall Chop + Wall Chords

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone apps and capture UI screenshots
        run: |
          mkdir -p snaps
          for pair in ".:WallVox:WallVox" "WallChop:WallChop:Wall Chop" "WallChords:WallChords:Wall Chords"; do
            src="${pair%%:*}"; rest="${pair#*:}"; tgt="${rest%%:*}"; prod="${rest#*:}"
            extra=""
            [ -d snap-WallVox/_deps/juce-src ] && extra="-DFETCHCONTENT_SOURCE_DIR_JUCE=$PWD/snap-WallVox/_deps/juce-src"
            cmake -S "$src" -B "snap-$tgt" -DCMAKE_BUILD_TYPE=Release -DWALL_SNAPSHOT=ON $extra > /dev/null
            cmake --build "snap-$tgt" --target "${tgt}_Standalone" -j 4 > "snap-$tgt.log" 2>&1 || { tail -40 "snap-$tgt.log"; exit 1; }
            WALL_SNAPSHOT_DIR="$PWD/snaps" timeout 90 "snap-$tgt/${tgt}_artefacts/Release/Standalone/$prod.app/Contents/MacOS/$prod" || true
          done
          ls -la snaps
      - name: Publish screenshots to the ui-snapshots branch
        run: |
          cd snaps
          git init -q -b ui-snapshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "UI snapshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-snapshots

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WallVox
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DWALLVOX_PRESET_INDEX_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/presets/index.json"
          cmake --build build --config Release -- -quiet

      - name: Build Wall Chop
        run: |
          cmake -S WallChop -B build-chop -G Xcode \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/build/_deps/juce-src" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DWALLVOX_PRESET_INDEX_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/WallChop/presets/index.json"
          cmake --build build-chop --config Release -- -quiet

      - name: Build Wall Chords
        run: |
          cmake -S WallChords -B build-chords -G Xcode \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/build/_deps/juce-src" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-chords --config Release -- -quiet

      - name: Package
        run: |
          for pair in "build:WallVox" "build-chop:WallChop" "build-chords:WallChords"; do
            dir="${pair%%:*}"; name="${pair##*:}"
            mkdir -p "out-$name"
            cp -R "$dir/${name}_artefacts/Release/VST3/"*.vst3 "out-$name/"
            cp -R "$dir/${name}_artefacts/Release/AU/"*.component "out-$name/"
            for b in "out-$name"/*.vst3 "out-$name"/*.component; do codesign --force --deep -s - "$b"; done
            cp install.command "out-$name/"
            chmod +x "out-$name/install.command"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: WallVox-Mac
          path: out-WallVox

      - uses: actions/upload-artifact@v4
        with:
          name: WallChop-Mac
          path: out-WallChop

      - uses: actions/upload-artifact@v4
        with:
          name: WallChords-Mac
          path: out-WallChords
